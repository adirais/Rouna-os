<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ROUNA OS</title>
<meta name="description" content="Sistem operasional internal Coffee Rouna">
<meta name="theme-color" content="#739ec9">
<meta name="robots" content="noindex,nofollow">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="assets/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/wanteddev/wanted-sans@v1.0.3/packages/wanted-sans/fonts/webfonts/variable/split/WantedSansVariable.min.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="config.js"></script>
<style>
/* Layout: operational console — sidebar on desktop, bottom tab bar on phone; content as scannable panels */
:root{
  /* Rouna brand: blue #739EC9, butter #FFF58A, white, ink #1E1E1E */
  --brand:#739EC9; --butter:#FFF58A; --white:#FFFFFF; --black:#1E1E1E;
  --bg:#F4F7FA; --surface:#FFFFFF; --sunk:#EAF0F6; --ink:#1E1E1E; --muted:#5B6470; --line:#DCE3EC;
  --accent:#3D6B98; --accent-ink:#FFFFFF; --accent-soft:#E2ECF6;
  --pri:#1E1E1E; --pri-ink:#FFFFFF; --hi:#FFF58A; --hi-ink:#1E1E1E;
  --ok:#2B7A50; --ok-soft:#DFF1E6; --warn:#8C6410; --warn-soft:#FBF3C9; --crit:#B23A2E; --crit-soft:#F9E1DD;
  --f-display:"Wanted Sans Variable","Wanted Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-body:"Wanted Sans Variable","Wanted Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"Wanted Sans Variable","Wanted Sans",system-ui,sans-serif;
  --r:14px;
}
:root[data-theme="dark"]{
  --bg:#141516; --surface:#1E1E1E; --sunk:#262829; --ink:#F2F2EE; --muted:#A3A9B0; --line:#33363A;
  --accent:#A9C6E3; --accent-ink:#141516; --accent-soft:#25313D;
  --pri:#F2F2EE; --pri-ink:#1E1E1E; --hi:#FFF58A; --hi-ink:#1E1E1E;
  --ok:#74C995; --ok-soft:#1B3325; --warn:#EBCB6B; --warn-soft:#3A3216; --crit:#EF8B7E; --crit-soft:#3C1F1B; color-scheme:dark}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;padding-top:env(safe-area-inset-top,0px);font-weight:450;color-scheme:light}
*{box-sizing:border-box}
h1,h2,h3{font-family:var(--f-display);font-weight:700;margin:0;text-wrap:balance;letter-spacing:-.015em}
h1{font-size:1.75rem;line-height:1.15} h2{font-size:1.12rem} h3{font-size:1rem}
.num,.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-feature-settings:'tnum'}
.muted{color:var(--muted)} .small{font-size:.82rem}
.eyebrow{font-size:.78rem;letter-spacing:.06em;color:var(--muted);font-weight:600}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.shell{display:grid;grid-template-columns:1fr;min-height:100%}
.side{display:none}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line);
  padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:10px;color:var(--ink)}
.brand .wm{height:20px;aspect-ratio:254/59.3}
.brand .os{font-size:.72rem;font-weight:700;letter-spacing:.14em;padding:2px 7px;border-radius:99px;background:var(--hi);color:var(--hi-ink)}
.who{display:flex;align-items:center;gap:8px;font-size:.85rem;min-width:0}
.who b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:120px}
main{padding-block:18px 110px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  max-width:1180px;width:100%;margin:0 auto;display:grid;gap:18px;min-width:0}
.bnav{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);
  display:flex;gap:2px;padding-bottom:env(safe-area-inset-bottom,0px);
  padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px))}
.bnav button{flex:1 1 0;min-width:0;border:0;background:none;padding:10px 4px 9px;font-size:.74rem;font-weight:600;color:var(--muted);cursor:pointer;position:relative;isolation:isolate;display:grid;justify-items:center;gap:3px}
.bnav svg{width:22px;height:22px;display:block}
.bnav button[aria-current="page"]{color:var(--ink)}
.bnav button[aria-current="page"]::before{content:"";position:absolute;top:6px;left:50%;width:44px;height:28px;transform:translateX(-50%);border-radius:99px;background:var(--hi);z-index:-1}
.badge{display:inline-flex;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--crit);color:#fff;font-size:.68rem;align-items:center;justify-content:center;margin-left:4px;font-family:var(--f-mono)}
@media (min-width:900px){
  .shell{grid-template-columns:232px 1fr}
  .side{display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh;padding:22px 14px;border-right:1px solid var(--line);background:var(--surface)}
  .side .brand{padding:2px 12px 22px}
  .side .brand .wm{height:22px}
  .side button{display:flex;justify-content:space-between;align-items:center;text-align:left;border:0;background:none;padding:9px 12px;border-radius:8px;font-weight:600;color:var(--muted);cursor:pointer}
  .side button:hover{background:var(--sunk);color:var(--ink)}
  .side button[aria-current="page"]{background:var(--hi);color:var(--hi-ink)}
  .side svg{width:18px;height:18px;flex:none}
  .side .nl{display:flex;align-items:center;gap:10px}
  .bnav{display:none} .top .brand{display:none}
  main{padding-block:26px 48px}
}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:grid;gap:12px;min-width:0}
.panel-h{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.grid2{display:grid;gap:18px;grid-template-columns:1fr}
.grid3{display:grid;gap:12px;grid-template-columns:repeat(2,minmax(0,1fr))}
@media (min-width:760px){.grid2{grid-template-columns:repeat(2,minmax(0,1fr))}.grid3{grid-template-columns:repeat(4,minmax(0,1fr))}}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:grid;gap:2px}
.kpi .v{font-family:var(--f-mono);font-size:1.35rem;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.pagehead{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

.btn{border:1px solid var(--line);background:var(--surface);padding:9px 15px;border-radius:99px;font-weight:600;cursor:pointer;font-size:.88rem;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.pri{background:var(--pri);border-color:var(--pri);color:var(--pri-ink)}
.btn.pri:hover{background:var(--brand);border-color:var(--brand);color:var(--black)}
.btn.ghost{border-color:transparent;background:none}
.btn.danger{color:var(--crit);border-color:var(--crit-soft)}
.btn.sm{padding:5px 11px;font-size:.8rem}
.btn:disabled{opacity:.5;cursor:not-allowed}
.chip{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:99px;font-size:.75rem;font-weight:600;background:var(--sunk);color:var(--muted);white-space:nowrap}
.chip.ok{background:var(--ok-soft);color:var(--ok)} .chip.warn{background:var(--warn-soft);color:var(--warn)} .chip.crit{background:var(--crit-soft);color:var(--crit)} .chip.acc{background:var(--accent-soft);color:var(--accent)}
.seg{display:inline-flex;background:var(--sunk);border-radius:99px;padding:3px;gap:2px;flex-wrap:wrap;justify-self:start}
.seg button{border:0;background:none;padding:6px 13px;border-radius:99px;font-weight:600;font-size:.82rem;color:var(--muted);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}

input[type=text],input[type=number],input[type=password],input[type=date],input[type=time],input:not([type]),select,textarea{
  border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px;width:100%;min-width:0;font-size:16px}
input:focus,select:focus,textarea:focus{border-color:var(--accent);outline:none}
label.f{display:grid;gap:4px;font-size:.82rem;font-weight:600;color:var(--muted)}
.fgrid{display:grid;gap:10px;grid-template-columns:1fr}
@media (min-width:560px){.fgrid.two{grid-template-columns:1fr 1fr}}

.tbl-wrap{overflow-x:auto;margin:0 -4px}
table{border-collapse:collapse;width:100%;font-size:.88rem}
th{text-align:left;font-size:.76rem;letter-spacing:.04em;color:var(--muted);font-weight:600;padding:8px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
td.r,th.r{text-align:right} tr:last-child td{border-bottom:0}
td .sub{display:block;font-size:.76rem;color:var(--muted)}

.alert{display:flex;gap:12px;align-items:flex-start;padding:11px 13px;border-radius:9px;background:var(--sunk);border-left:3px solid var(--muted)}
.alert.crit{background:var(--crit-soft);border-color:var(--crit)} .alert.warn{background:var(--warn-soft);border-color:var(--warn)} .alert.ok{background:var(--ok-soft);border-color:var(--ok)} .alert.acc{background:var(--accent-soft);border-color:var(--accent)}
.alert .grow{flex:1;min-width:0}
.list{display:grid;gap:0}
.li{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);align-items:center}
.li:last-child{border-bottom:0}
.li .grow{min-width:0;flex:1}
.empty{padding:22px 14px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:var(--r);display:grid;gap:8px;justify-items:center}

.bar{height:8px;border-radius:4px;background:var(--sunk);overflow:hidden}
.bar i{display:block;height:100%;background:var(--brand);border-radius:4px}
.bar.low i{background:var(--crit)}
.hbars{display:grid;gap:8px}
.hb{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;font-size:.86rem}
.hb .bar{grid-column:1/-1}

.modal-bg{position:fixed;inset:0;background:rgba(30,30,30,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
@media (min-width:700px){.modal-bg{align-items:center}}
.modal{background:var(--surface);width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:14px 14px 0 0;
  padding-block:18px calc(18px + env(safe-area-inset-bottom,0px));padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));display:grid;gap:14px}
.modal.wide{max-width:920px}
@media (min-width:700px){.modal{border-radius:14px}}
.modal-h{display:flex;justify-content:space-between;align-items:center;gap:10px}
.lines{display:grid;gap:8px}
.line{display:grid;grid-template-columns:minmax(0,1fr) 96px 34px;gap:6px;align-items:center}
.line .u{font-size:.75rem;color:var(--muted)}
.foot{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap;position:sticky;bottom:calc(-18px - env(safe-area-inset-bottom,0px));background:var(--surface);padding-block:10px;border-top:1px solid var(--line)}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:30;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:9px;font-weight:600;font-size:.88rem;max-width:calc(100% - 32px)}
@media (min-width:900px){.toast{bottom:28px}}

.login{min-height:100%;display:grid;place-items:center;padding-block:32px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.login .card{width:100%;max-width:420px;display:grid;gap:16px}
.login .mark{display:flex;align-items:center;gap:10px;color:var(--ink)}
.login .mark .wm{height:30px;aspect-ratio:254/59.3}
.people{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px}
.person{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px;text-align:left;cursor:pointer;display:grid;gap:2px}
.person[aria-pressed="true"]{border-color:var(--ink);background:var(--hi);color:var(--hi-ink)}
.person b{font-size:.92rem}
.thumb{width:40px;height:40px;border-radius:8px;object-fit:cover;background:var(--sunk);display:block}
.selfie{width:100%;max-width:260px;aspect-ratio:3/4;object-fit:cover;border-radius:12px;background:var(--sunk)}
.ai{white-space:normal;line-height:1.6}
.ai ul{margin:6px 0;padding-left:20px}
.ai p{margin:6px 0}
svg text{fill:var(--muted);font-family:var(--f-mono);font-size:10px}
.quad{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.quad > div{border:1px solid var(--line);border-radius:9px;padding:10px;display:grid;gap:4px;align-content:start;min-width:0}
.quad .tag{font-weight:700;font-family:var(--f-display)}
.mrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 16px;align-items:center;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:11px 6px;cursor:pointer;color:inherit;font:inherit;border-radius:6px}
.mrow:last-child{border-bottom:0}
.mrow:hover{background:var(--sunk)}
.mrow .sub{display:block}
.mmet{display:grid;grid-template-columns:repeat(4,minmax(64px,auto));gap:14px;align-items:center;text-align:right;font-family:var(--f-mono);font-size:.86rem;font-variant-numeric:tabular-nums}
.mmet small{display:block;font-family:var(--f-body);font-size:.7rem;letter-spacing:.04em;color:var(--muted)}
@media (max-width:640px){.mrow{grid-template-columns:1fr}.mmet{grid-template-columns:repeat(4,minmax(0,1fr));text-align:left;gap:8px}}
.ro{padding:9px 12px;border-radius:9px;background:var(--warn-soft);color:var(--warn);font-size:.85rem;font-weight:600}
@media (prefers-reduced-motion:no-preference){.modal{animation:up .18s ease-out}@keyframes up{from{transform:translateY(12px);opacity:.6}}}

/* ---- Rouna web additions ---- */
.wm{display:inline-block;background:currentColor;-webkit-mask:url(assets/wordmark.svg) no-repeat center/contain;mask:url(assets/wordmark.svg) no-repeat center/contain}
.login{position:relative;overflow:hidden;background:var(--brand);min-height:100vh;min-height:100dvh}
.login::before{content:"";position:absolute;width:max(165vw,700px);aspect-ratio:255/163;left:-30%;bottom:-14%;background:var(--butter);
  -webkit-mask:url(assets/mark.svg) no-repeat center/contain;mask:url(assets/mark.svg) no-repeat center/contain;pointer-events:none}
.login .card{position:relative;background:var(--surface);border-radius:22px;padding:28px 24px;box-shadow:0 24px 60px -30px rgba(30,30,30,.45)}
.login .tag{font-size:.82rem;letter-spacing:.12em;color:var(--muted);margin:2px 0 0}
.login .people{grid-template-columns:repeat(auto-fill,minmax(130px,1fr))}
.login .pinrow{display:flex;gap:8px}
.login .link{background:none;border:0;padding:0;color:var(--accent);font-weight:600;cursor:pointer;justify-self:start}
@media (min-width:900px){.login::before{left:auto;right:-14%;bottom:-38%;width:min(92vw,1400px)}}
.li .sub{display:block}
.top .who{margin-left:auto}
.top .ctx{display:none}
@media (min-width:900px){.top .ctx{display:block}}
.top .brand .wm{height:18px}
.more{position:fixed;inset:0;z-index:8;background:rgba(30,30,30,.35);display:flex;align-items:flex-end}
.more .sheet{background:var(--surface);width:100%;border-radius:20px 20px 0 0;padding:18px 16px calc(84px + env(safe-area-inset-bottom,0px));display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.more .sheet button{border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:14px 6px;display:grid;justify-items:center;gap:6px;font-weight:600;font-size:.82rem;color:var(--ink);cursor:pointer;position:relative}
.more .sheet button[aria-current="page"]{background:var(--hi);border-color:var(--hi);color:var(--hi-ink)}
.more .sheet svg{width:22px;height:22px}
.more .sheet .badge{position:absolute;top:6px;right:6px}
.bnav .badge{position:absolute;top:4px;left:calc(50% + 6px);margin:0}
@media (min-width:900px){.more{display:none}}
.who .chip.acc{background:var(--hi);color:var(--hi-ink)}

/* less text */
body:not(.hints) main .panel > p.small.muted, body:not(.hints) .hint{display:none}
.hintbtn{width:30px;height:30px;padding:0;border-radius:50%;border:1px solid var(--line)!important;font-weight:700}
.hintbtn[aria-pressed="true"]{background:var(--hi);border-color:var(--hi)!important;color:var(--hi-ink)}
.qa{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px}
.qa-b{display:grid;justify-items:center;gap:8px;padding:16px 8px 14px;border:1px solid var(--line);border-radius:16px;background:var(--surface);font-weight:600;font-size:.84rem;color:var(--ink);cursor:pointer}
.qa-b svg{width:26px;height:26px;color:var(--accent)}
.qa-b:hover{border-color:var(--brand);background:var(--accent-soft)}
@media (max-width:560px){.qa{grid-template-columns:repeat(3,minmax(0,1fr))}}
.guide-mini{display:flex;align-items:center;justify-content:space-between;gap:14px;width:100%;padding:14px 18px;border:1px dashed var(--line);border-radius:var(--r);background:var(--surface);cursor:pointer;color:var(--ink);text-align:left;font:inherit}
.guide-mini > span:first-child{flex:1;min-width:0}
@media (max-width:560px){.who .chip{display:none}}

/* v2 */
.tgt-row{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.tgt .big{font-size:1.7rem;font-weight:700;letter-spacing:-.02em;line-height:1.1}
.tgt-bar,.stack{position:relative;height:12px;border-radius:6px;background:var(--sunk);overflow:visible;display:flex}
.tgt-bar i{border-radius:6px}
.tgt-bar s,.stack s{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--ink);text-decoration:none}
.stack i{display:block;height:100%}.stack i:first-child{border-radius:6px 0 0 6px}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;vertical-align:baseline}
.r{text-align:right}
.shift-tbl th.c,.shift-tbl td.c{text-align:center;padding:6px 4px}
.shift-tbl th.today{color:var(--ink);background:var(--hi);border-radius:8px 8px 0 0}
.shift-tbl tr.me td{background:var(--accent-soft)}
.sh,.sh-sel{display:inline-block;min-width:44px;padding:6px 4px;border-radius:10px;font-weight:700;text-align:center;font-size:.85rem;border:1px solid var(--line);background:var(--surface)}
.sh-sel{width:52px;appearance:none;-webkit-appearance:none;cursor:pointer}
.sh-P{background:#E2ECF6;border-color:#C5D8EC}.sh-S{background:#FFF9C4;border-color:#F2E88A}.sh-M{background:#E4E1F5;border-color:#CFC9EE}.sh-L{background:var(--sunk);color:var(--muted)}.sh-x{color:var(--muted)}
.pay-tbl td,.pay-tbl th{white-space:nowrap}.pay-tbl tr.tot td{border-top:2px solid var(--line)}
.pay-tbl input.cell-in{width:74px!important;text-align:right;padding:5px 6px!important}.pay-tbl th,.pay-tbl td{padding-left:6px;padding-right:6px}
a.btn{text-decoration:none;color:inherit;display:inline-block}
form[data-submit=shiftDefs] .fgrid{max-width:640px}
.linkbtn{background:none;border:0;padding:0;font:inherit;color:inherit;cursor:pointer;text-align:left}.linkbtn:hover b{color:var(--accent);text-decoration:underline}
ol.steps{margin:0;padding-left:20px;display:grid;gap:4px}
code{background:var(--sunk);padding:1px 6px;border-radius:6px;font-size:.9em}

.upd{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:40;display:flex;align-items:center;gap:12px;background:var(--hi);color:var(--hi-ink);padding:10px 12px 10px 16px;border-radius:99px;font-weight:600;font-size:.9rem;box-shadow:0 10px 30px -12px rgba(30,30,30,.4);white-space:nowrap}
@media (min-width:900px){.upd{bottom:28px}}

.kpi-btn{text-align:left;cursor:pointer;font:inherit;color:inherit}

<script>
(() => {
"use strict";
/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

const HARI = ["Min","Sen","Sel","Rab","Kam","Jum","Sab"];

const fdate = s => { if (!s) return "-"; const d = new Date(s + "T12:00:00"); return HARI[d.getDay()] + ", " + d.getDate() + " " + BLN[d.getMonth()]; };
const ftime = ts => { if (!ts) return "-"; const d = new Date(ts); return pad(d.getHours()) + ":" + pad(d.getMinutes()); };

const rp = n => "Rp " + Math.round(n || 0).toLocaleString("id-ID");
const rpk = n => { n = n || 0; if (Math.abs(n) >= 1e6) return "Rp " + (n / 1e6).toLocaleString("id-ID", {maximumFractionDigits: 1}) + " jt"; if (Math.abs(n) >= 1e3) return "Rp " + Math.round(n / 1e3).toLocaleString("id-ID") + " rb"; return rp(n); };
const fq = n => (Math.round((n || 0) * 100) / 100).toLocaleString("id-ID", {maximumFractionDigits: 2});
const pct = n => (isFinite(n) ? (n * 100).toLocaleString("id-ID", {maximumFractionDigits: 1}) : "0") + "%";
const norm = s => String(s || "").toLowerCase().replace(/\s+/g, " ").trim();
const slug = s => norm(s).replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "").slice(0, 80) || ("p-" + uid());
function num(v) {
  if (typeof v === "number") return v;
  if (v == null) return 0;
  let s = String(v).replace(/[^0-9,.\-]/g, "");
  if (!s) return 0;
  const lc = s.lastIndexOf(","), ld = s.lastIndexOf(".");
  if (lc > -1 && ld > -1) { s = lc > ld ? s.replace(/\./g, "").replace(",", ".") : s.replace(/,/g, ""); }
  else if (lc > -1) { const p = s.split(","); s = (p.length === 2 && p[1].length !== 3) ? s.replace(",", ".") : s.replace(/,/g, ""); }
  else if (ld > -1) { const p = s.split("."); if (p.length > 2 || (p.length === 2 && p[1].length === 3)) s = s.replace(/\./g, ""); }
  const n = parseFloat(s); return isNaN(n) ? 0 : n;
}
function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
function lsSet(k, v) { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch (e) {} }
async function sha(s) { const b = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(s)); return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, "0")).join(""); }
let toastT;
function toast(msg) { const t = $("#toast"); t.innerHTML = '<div class="toast" role="status">' + esc(msg) + "</div>"; clearTimeout(toastT); toastT = setTimeout(() => t.innerHTML = "", 3200); }

const ROLES = {owner: "Owner", manager: "Manager", finance: "Finance", headbar: "Headbar", kitchen: "Kitchen", gudang: "Gudang", crew: "Crew"};
const AREAS = {bar: "Bar", kitchen: "Kitchen"};
const NAV = [
  ["home", "Beranda", ["manager", "finance", "headbar", "gudang", "kitchen", "crew"]],
  ["stok", "Stok", ["manager", "finance", "headbar", "gudang", "kitchen"]],
  ["order", "Order", ["manager", "finance", "headbar", "gudang", "kitchen"]],
  ["closing", "Closing", ["manager", "headbar", "kitchen", "crew"]],
  ["menu", "Menu", ["manager", "finance", "headbar", "kitchen", "crew"]],
  ["sales", "Penjualan", ["manager", "finance", "headbar"]],
  ["analitik", "Analitik", ["manager", "finance"]],

const STATUS = {diajukan: ["Diajukan", "warn"], disetujui: ["Disetujui", "acc"], dipesan: ["Dipesan", "acc"], diterima: ["Diterima", "ok"], ditolak: ["Ditolak", "crit"], dibatalkan: ["Dibatalkan", ""]};

/* ---------- state ---------- */
const S = {
  hints: lsGet("rouna_hints") === "1", shifts: [], salary: {}, payables: [], tg: null, notify: {}, bank: {}, banktx: [], assets: [], audit: null, db: null, assets: null, sample: null, dl: null, session: null, authMode: "login", authUser: "", readOnly: false,
  items: {}, stock: {}, staff: {}, recipes: {}, orders: [], moves: [], closings: [], sales: [], attendance: [], daily: [], vouchers: [], expenses: [], cash: [], payroll: [], prices: {}, sops: [], calibs: [], briefs: [], docs: [], sop: {}, settings: {},
  ready: {}, me: lsGet("runa_me"), view: lsGet("runa_view") || "home",
  ui: {q: "", cat: "", area: "", st: "", range: 30, closeArea: "bar", recDate: "", salesDay: "", ordTab: "aktif", setTab: "staf", menuTab: "menu", menuId: "", absMonth: today().slice(0, 7), finTab: "pl", finMonth: today().slice(0, 7), anTab: "menu", priceItem: "", sopTab: "check", docId: ""},

/* ---------- Supabase data layer (same API shape the app used on claude.ai) ---------- */
const CFG = window.ROUNA_CONFIG || {};
const SB = (window.supabase && CFG.url && CFG.anonKey) ? window.supabase.createClient(CFG.url, CFG.anonKey, {auth: {persistSession: true, autoRefreshToken: true, storageKey: "rouna-auth"}}) : null;
const EMAIL_DOMAIN = "rounaos.app";
const pinPass = p => "rouna-" + p;
function dbError(e) {
  const err = new Error(e?.message || "Gagal");
  if (e?.code === "42501" || /row-level security/i.test(e?.message || "")) { err.code = "denied"; err.message = "Peranmu tidak punya akses untuk menyimpan data ini."; }
  return err;
}
function makeDb() {
  const watchers = new Map(); // col -> Set(refetch)
  let pending = {}, timer = null;
  function bump(col) {
    pending[col] = true; clearTimeout(timer);
    timer = setTimeout(() => { const cols = Object.keys(pending); pending = {}; cols.forEach(c => (watchers.get(c) || []).forEach(f => f())); }, 250);
  }
  function bumpAll() { watchers.forEach((_, c) => bump(c)); }
  const chan = SB.channel("docs-all").on("postgres_changes", {event: "*", schema: "public", table: "docs"}, p => {
    const c = p.new?.col || p.old?.col; if (c) bump(c); else bumpAll();
  }).subscribe();
  document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") bumpAll(); });
  window.addEventListener("online", bumpAll);
  const snapOf = rows => ({empty: !rows.length, size: rows.length, docs: rows.map(r => ({id: r.id, exists: true, data: () => r.data}))});
  function docRef(path) {
    const i = path.indexOf("/"), col = path.slice(0, i), id = path.slice(i + 1);
    return {
      id,
      async get() { const {data, error} = await SB.from("docs").select("data").eq("col", col).eq("id", id).maybeSingle(); if (error) throw dbError(error); return {id, exists: !!data, data: () => data?.data}; },
      async set(data) { const {error} = await SB.from("docs").upsert({col, id, data}); if (error) throw dbError(error); bump(col); },
      async update(patch) { const {error} = await SB.rpc("merge_doc", {p_col: col, p_id: id, p_patch: patch, p_base: {}}); if (error) throw dbError(error); bump(col); },
      async delete() { const {error} = await SB.from("docs").delete().eq("col", col).eq("id", id); if (error) throw dbError(error); bump(col); }
    };
  }
  function collection(col) {
    const q = {ord: null, lim: null};
    async function fetch() {
      let r = SB.from("docs").select("id,data").eq("col", col);
      if (q.ord) r = r.order("data->" + q.ord[0], {ascending: q.ord[1] !== "desc", nullsFirst: false});
      r = r.limit(q.lim || 5000);
      const {data, error} = await r; if (error) throw dbError(error); return data || [];
    }
    const api = {
      orderBy(f, dir) { q.ord = [f, dir || "asc"]; return api; },
      limit(n) { q.lim = n; return api; },
      doc(id) { return docRef(col + "/" + id); },
      async get() { return snapOf(await fetch()); },
      onSnapshot(next, onErr) {
        let alive = true, busy = false, again = false;
        const run = async () => {
          if (busy) { again = true; return; } busy = true;
          try { const rows = await fetch(); if (alive) next(snapOf(rows)); } catch (e) { if (alive && onErr) onErr(e); }
          busy = false; if (again) { again = false; run(); }
        };
        if (!watchers.has(col)) watchers.set(col, new Set());
        watchers.get(col).add(run); run();
        return () => { alive = false; watchers.get(col).delete(run); };
      }
    };
    return api;
  }
  return {collection, doc: docRef, bump, close: () => SB.removeChannel(chan)};
}
async function callFn(name, body) {
  const {data, error} = await SB.functions.invoke(name, {body});
  if (error) {
    let msg = error.message, code = "";
    try { const j = await error.context.json(); msg = j.error || msg; code = j.code || ""; } catch (e) {}
    const err = new Error(msg); err.code = code; throw err;
  }
  return data;
}
const photoSrc = x => !x ? "" : x.asset ? (/^https?:/.test(x.asset) ? x.asset : "/_blob/" + x.asset) : (x.pic || "");
function rememberUser(u, name) {
  let list = []; try { list = JSON.parse(lsGet("rouna_users") || "[]"); } catch (e) {}
  list = [{u, name}, ...list.filter(x => x.u !== u)].slice(0, 12); lsSet("rouna_users", JSON.stringify(list));
}
function knownUsers() { try { return JSON.parse(lsGet("rouna_users") || "[]"); } catch (e) { return []; } }

/* ---------- db plumbing ---------- */
async function guard(fn) {
  try { await fn(); return true; }
  catch (e) {
    console.error(e);
    if (e && e.code === "denied") toast(e.message);
    else if (e && /JWT|session/i.test(e.message || "")) toast("Sesi habis. Masuk lagi.");
    else toast("Gagal menyimpan: " + (e?.message || "coba lagi"));
    return false;
  }
}
async function mergeDoc(path, patch, base) {
  const i = path.indexOf("/"), col = path.slice(0, i);
  const {error} = await SB.rpc("merge_doc", {p_col: col, p_id: path.slice(i + 1), p_patch: patch, p_base: base || {}});
  if (error) throw dbError(error);
  S.db.bump(col);
}
async function logMoves(entries) {
  if (!entries.length) return;
  const date = today(); const list = {};
  entries.forEach(e => list[uid()] = Object.assign({ts: Date.now(), by: S.me}, e));
  await mergeDoc("moves/" + date, {list}, {date});
}
async function setStock(id, patch) {
  const cur = stockOf(id);
  const next = {gudang: +(cur.gudang || 0), area: +(cur.area || 0), ...patch, updatedAt: Date.now()};
  next.gudang = Math.round(next.gudang * 1000) / 1000; next.area = Math.round(next.area * 1000) / 1000;
  S.stock[id] = next;
  await S.db.doc("stock/" + id).set(next);
}
function subscribe(q, key, mapFn) {
  q.onSnapshot(snap => { mapFn(snap); S.ready[key] = true; scheduleRender(); },
    e => { console.warn(key, e); S.ready[key] = true; scheduleRender(); });
}
function mapColl(key) { return snap => { const o = {}; snap.docs.forEach(d => o[d.id] = d.data()); S[key] = o; }; }
function listColl(key) { return snap => { S[key] = snap.docs.map(d => ({id: d.id, ...d.data()})); }; }

async function boot() {
  if (!SB) { renderNoDb(); return; }
  S.upl = {upload: async (blob, opt) => {
    const name = new Date().toISOString().slice(0, 7) + "/" + (crypto.randomUUID ? crypto.randomUUID() : uid() + uid()) + ".jpg";
    const {error} = await SB.storage.from("photos").upload(name, blob, {contentType: opt?.type || "image/jpeg", upsert: false});
    if (error) throw error;
    return {id: SB.storage.from("photos").getPublicUrl(name).data.publicUrl};
  }};
  S.dl = {save: async ({filename, data}) => {
    const b = data instanceof Blob ? data : new Blob([data], {type: /\.csv$/.test(filename) ? "text/csv;charset=utf-8" : /\.json$/.test(filename) ? "application/json" : "application/octet-stream"});
    const a = document.createElement("a"); a.href = URL.createObjectURL(b); a.download = filename; document.body.appendChild(a); a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
  }};
  SB.auth.onAuthStateChange((ev) => { if (ev === "SIGNED_OUT" && S.session) location.reload(); });
  const {data: {session}} = await SB.auth.getSession();
  if (!session) return showAuth();
  await startData(session);
}
async function showAuth() {
  S.session = null;
  let has = true;
  try { const {data, error} = await SB.rpc("has_accounts"); if (!error) has = !!data; } catch (e) {}
  S.authMode = has ? "login" : "setup";
  const k = knownUsers(); if (!S.authUser && k.length === 1) S.authUser = k[0].u;
  renderAuth();
}
async function startData(session) {
  S.session = session;
  const {data: sid, error} = await SB.rpc("my_staff_id");
  if (error || !sid) { $("#app").innerHTML = viewNoLink(); return; }
  S.me = sid;
  S.db = makeDb();
  const r0 = await SB.rpc("my_role");
  if (["owner", "manager", "finance"].includes(r0.data)) {
    S.sample = async prompt => { try { return await callFn("ai", {prompt}); } catch (e) { throw {code: e.code || "failed", text: "", message: e.message}; } };
  }
  subscribe(S.db.collection("items"), "items", mapColl("items"));
  subscribe(S.db.collection("stock"), "stock", mapColl("stock"));
  subscribe(S.db.collection("staff"), "staff", mapColl("staff"));
  subscribe(S.db.collection("recipes"), "recipes", mapColl("recipes"));
  subscribe(S.db.collection("settings"), "settings", snap => { const o = {}; snap.docs.forEach(d => o[d.id] = d.data()); S.settings = o.app || {}; S.sop = o.sop || {}; S.notify = o.notify || {}; });
  subscribe(S.db.collection("orders").orderBy("createdAt", "desc").limit(200), "orders", listColl("orders"));
  subscribe(S.db.collection("moves").orderBy("date", "desc").limit(45), "moves", listColl("moves"));
  subscribe(S.db.collection("closings").orderBy("date", "desc").limit(120), "closings", listColl("closings"));
  subscribe(S.db.collection("sales").orderBy("date", "desc").limit(120), "sales", listColl("sales"));
  subscribe(S.db.collection("attendance").orderBy("date", "desc").limit(62), "attendance", listColl("attendance"));
  subscribe(S.db.collection("daily").orderBy("date", "desc").limit(120), "daily", listColl("daily"));
  if (["owner", "manager", "finance"].includes(r0.data)) {
    subscribe(S.db.collection("expenses").orderBy("month", "desc").limit(13), "expenses", listColl("expenses"));
    subscribe(S.db.collection("payroll"), "payroll", listColl("payroll"));
    subscribe(S.db.collection("salary"), "salary", mapColl("salary"));
    subscribe(S.db.collection("payables"), "payables", listColl("payables"));
    subscribe(S.db.collection("bank"), "bank", mapColl("bank"));
    subscribe(S.db.collection("banktx").orderBy("month", "desc").limit(24), "banktx", listColl("banktx"));
    subscribe(S.db.collection("assets"), "assets", listColl("assets"));
    subscribe(S.db.collection("briefs").orderBy("date", "desc").limit(3), "briefs", listColl("briefs"));
  }
  if (["owner", "manager", "finance", "headbar"].includes(r0.data)) subscribe(S.db.collection("cash").orderBy("month", "desc").limit(13), "cash", listColl("cash"));
  subscribe(S.db.collection("prices"), "prices", mapColl("prices"));
  subscribe(S.db.collection("sop").orderBy("date", "desc").limit(31), "sops", listColl("sops"));
  subscribe(S.db.collection("calib").orderBy("date", "desc").limit(31), "calibs", listColl("calibs"));
  subscribe(S.db.collection("docs"), "docs", listColl("docs"));
  subscribe(S.db.collection("voucher").orderBy("month", "desc").limit(12), "vouchers", listColl("vouchers"));
  subscribe(S.db.collection("shift").orderBy("month", "desc").limit(4), "shifts", listColl("shifts"));
}

async function submitMove(form) {
  const k = form.dataset.k, lines = readLines(form), note = form.note?.value || "";
  if (!lines.length) return toast("Isi minimal satu bahan dan jumlahnya.");
  if (k === "take" || k === "ret") {
    for (const l of lines) { const s = stockOf(l.itemId); const have = k === "take" ? s.gudang : s.area;
      if ((have || 0) < l.qty) return toast(`${S.items[l.itemId].name}: stok ${k === "take" ? "gudang" : "area"} hanya ${fq(have)}.`); }
  }

    const log = [];

      const s = stockOf(l.itemId);
      if (k === "in") { await setStock(l.itemId, {gudang: (s.gudang || 0) + l.qty}); if (l.price > 0) { await logPrice(l.itemId, l.price, "barang masuk" + (note ? " · " + note : "")); await S.db.doc("items/" + l.itemId).update({cost: l.price}); } log.push({t: "in", itemId: l.itemId, qty: l.qty, note, price: l.price || +S.items[l.itemId].cost || 0}); }

      if (k === "ret") { await setStock(l.itemId, {gudang: (s.gudang || 0) + l.qty, area: s.area - l.qty}); log.push({t: "ret", itemId: l.itemId, qty: l.qty, note}); }

    }
    await logMoves(log);
  });
  if (ok) { closeModal(); toast("Tersimpan. Stok sudah diperbarui."); }
}

function pdfLines(items) {
  const byPage = {};
  items.filter(it => String(it.str).trim()).forEach(it => (byPage[it.page] ||= []).push(it));
  const lines = [];
  Object.keys(byPage).sort((a, b) => a - b).forEach(pg => {
    const arr = byPage[pg].sort((a, b) => a.y - b.y || a.x - b.x);
    const rows = [];
    arr.forEach(it => { const r = rows.find(r => Math.abs(r.y - it.y) <= 2.5); if (r) r.items.push(it); else rows.push({y: it.y, items: [it]}); });
    rows.sort((a, b) => a.y - b.y).forEach(r => {
      const its = r.items.sort((a, b) => a.x - b.x), cells = [];
      let cur = null;
      its.forEach(it => {
        const s = String(it.str).trim();
        if (cur && it.x - cur.end < 7) { cur.t += " " + s; cur.end = it.x + it.w; }
        else { cur = {t: s, end: it.x + it.w}; cells.push(cur); }
      });
      lines.push(cells.map(c => c.t.replace(/\s+/g, " ").trim()));
    });
  });
  return lines;
}
const EN_ID_MON = {jan:1,feb:2,mar:3,apr:4,may:5,mei:5,jun:6,jul:7,aug:8,agu:8,ags:8,sep:9,oct:10,okt:10,nov:11,dec:12,des:12};
function monDate(s) {

let CC = {};
function itemCost(id, depth) {
  if (id in CC) return CC[id];
  const it = S.items[id]; if (!it) return 0;
  let c = +it.cost || 0;
  const pr = it.prep;
  if (pr && (pr.lines || []).length && (depth || 0) < 4) {
    const y = +pr.yield || 0, tot = pr.lines.reduce((s, l) => s + l.qty * itemCost(l.itemId, (depth || 0) + 1), 0);
    if (y > 0 && tot > 0) c = tot / y;
  }
  return CC[id] = c;
}

const priceHist = id => Object.values(S.prices[id]?.list || {}).sort((a, b) => a.ts - b.ts);
function priceChanges(days) {

    const h = priceHist(i.id), inWin = h.filter(x => x.ts >= cut), last = h[h.length - 1];

  });
}

const EXP_GROUPS = [

const EXP_CATS = EXP_GROUPS.flatMap(g => g[1]);

const PAY_METHODS = ["Transfer", "QRIS", "Cash", "Debit"];
const shareA = () => (+S.settings.share > 0 ? +S.settings.share : 40) / 100;
const expEntries = mo => Object.entries(S.expenses.find(e => e.month === mo)?.rec || {}).map(([id, r]) => ({id, ...r})).filter(r => !r.void).sort((a, b) => (b.date || "").localeCompare(a.date || "") || (b.ts || 0) - (a.ts || 0));
const cashEntries = mo => Object.entries(S.cash.find(e => e.month === mo)?.rec || {}).map(([id, r]) => ({id, ...r})).filter(r => !r.void).sort((a, b) => a.date.localeCompare(b.date) || (a.shift || 0) - (b.shift || 0));
const payrollOf = mo => S.payroll.find(p => p.month === mo) || null;
const cashTotal = c => +c.total || ((+c.cashPos || 0) + (+c.qrPos || 0) + (+c.card || 0));
function pnl(mo) {
  const cash = cashEntries(mo), daily = S.daily.filter(d => d.date.startsWith(mo)), sales = S.sales.filter(s => s.date.startsWith(mo));
  let rev, revDays, revSrc;
  if (cash.length) { rev = cash.reduce((s, c) => s + cashTotal(c), 0); revDays = new Set(cash.map(c => c.date)).size; revSrc = "Kas harian per shift"; }
  else if (daily.length) { rev = daily.reduce((s, d) => s + (d.pl?.revenue || 0), 0); revDays = daily.length; revSrc = "Laporan Olsera"; }
  else { rev = sales.reduce((s, x) => s + (x.total || 0), 0); revDays = sales.length; revSrc = sales.length ? "Penjualan per produk" : "Belum ada data"; }
  const ex = expEntries(mo), byCat = {}; ex.forEach(e => byCat[e.cat] = (byCat[e.cat] || 0) + (+e.amt || 0));
  const pr = payrollOf(mo), payNet = pr ? +pr.bersih || 0 : 0;
  const groups = EXP_GROUPS.map(([g, cats]) => { const rows = cats.filter(c => byCat[c]).map(c => [c, byCat[c]]); const extra = Object.keys(byCat).filter(c => !EXP_CATS.includes(c) && g === "Operasional (non-produksi)").map(c => [c, byCat[c]]);
    const all = [...rows, ...extra]; if (g === "Gaji Karyawan" && pr) all.unshift(["Gaji bersih (payroll)", payNet]); return {g, rows: all, total: all.reduce((s, x) => s + x[1], 0)}; });
  const nb = groups.find(x => x.g === "Non-Beban"), beban = groups.filter(x => x.g !== "Non-Beban").reduce((s, x) => s + x.total, 0);

function terbilang(n) {

}

/* ===== HPP versi ROUNA: jumlah terjual per produk (Olsera) × COGS resep ===== */

    ${gap != null ? `<div class="li"><span class="grow muted">Selisih Olsera − ROUNA<span class="sub small muted">${Math.abs(gap) > h.hpp * .05 ? "cek harga pokok produk di Olsera" : "masih wajar (≤5%)"}</span></span><span class="num" style="color:${Math.abs(gap) > h.hpp * .05 ? "var(--warn)" : "inherit"}">${rp(gap)}</span></div>` : ""}

      const txt = f => its.filter(f).map(i => i.str.trim()).filter(Boolean).join(" ").replace(/\s+/g, " ").trim();

function fnbBuckets(P) {
  const r = P.rev || 0, used = new Set(), out = FNB.map(b => {
    let v = 0;
    if (b.k === "labor") v = P.labor; else (b.cats || []).forEach(c => { v += P.byCat[c] || 0; used.add(c); });
    return {...b, v, p: r ? v / r * 100 : 0};

  const cost = out.reduce((s, x) => s + x.v, 0), laba = r - cost;
  return {list: out, cost, laba, lp: r ? laba / r * 100 : 0, gross: r ? (r - out[0].v) / r * 100 : 0, prime: r ? (out[0].v + out[1].v) / r * 100 : 0};
}

  return `<svg viewBox="0 0 180 180" width="200" height="200" role="img" aria-label="Diagram komposisi pendapatan" style="max-width:100%;flex:none"><circle r="${R}" cx="90" cy="90" fill="none" stroke="var(--line)" stroke-width="30"/>${segs}<text x="90" y="86" text-anchor="middle" style="font:700 17px var(--font,inherit);fill:var(--ink)">${center}</text><text x="90" y="104" text-anchor="middle" style="font:500 10px var(--font,inherit);fill:var(--muted)">${sub}</text></svg>`;

/* ===== Kas & Bank ===== */
const ACC_KIND = {kas: "Kas tunai", bank: "Rekening bank", ewallet: "E-wallet / QRIS"};
const accList = () => Object.entries(S.bank).map(([id, a]) => ({id, ...a})).filter(a => !a.void).sort((a, b) => (a.order || 0) - (b.order || 0) || a.name.localeCompare(b.name));
const allCashRecs = () => S.cash.flatMap(m => Object.entries(m.rec || {}).map(([id, r]) => ({id, ...r}))).filter(r => !r.void && r.date);
const allExpRecs = () => S.expenses.flatMap(m => Object.entries(m.rec || {}).map(([id, r]) => ({id, ...r}))).filter(r => !r.void && r.date);
const allBankTx = () => S.banktx.flatMap(m => Object.entries(m.rec || {}).map(([id, r]) => ({id, ...r}))).filter(r => !r.void && r.date);
/* every money movement for an account, oldest first: {date, amt(+/-), src, note} */
function accMoves(a) {
  const out = [], from = a.openDate || "0000";
  allCashRecs().forEach(c => { if (c.date < from) return;
    const cashAmt = +(c.cashAct ?? c.cashPos) || 0, nonCash = (+(c.qrAct ?? c.qrPos) || 0) + (+c.card || 0);
    if (a.cashIn === "cash" && cashAmt) out.push({date: c.date, amt: cashAmt, src: "Penjualan tunai", note: "Shift " + (c.shift || "-")});
    if (a.cashIn === "qr" && nonCash) out.push({date: c.date, amt: nonCash, src: "Penjualan QR & kartu", note: "Shift " + (c.shift || "-")}); });
  allExpRecs().forEach(e => { if (e.date < from || !(a.pays || []).includes(e.pay)) return;
    out.push({date: e.date, amt: -(+e.amt || 0), src: e.cat || "Pengeluaran", note: [e.to, e.note].filter(Boolean).join(" · ")}); });
  allBankTx().forEach(t => { if (t.date < from) return;
    if (t.to === a.id) out.push({date: t.date, amt: +t.amt || 0, src: t.from ? "Transfer masuk" : (t.label || "Dana masuk"), note: t.note || "", tx: t.id});
    if (t.from === a.id) out.push({date: t.date, amt: -(+t.amt || 0), src: t.to ? "Transfer keluar" : (t.label || "Dana keluar"), note: t.note || "", tx: t.id}); });
  return out.sort((x, y) => x.date.localeCompare(y.date));
}
const accBalance = (a, upto) => (+a.open || 0) + accMoves(a).filter(m => m.date <= (upto || "9999")).reduce((s, m) => s + m.amt, 0);
function unmappedExp(mo) { const pays = new Set(accList().flatMap(a => a.pays || [])); return expEntries(mo).filter(e => !pays.has(e.pay)); }
function viewBank(mo) {
  const accs = accList(), t = today();

function monthsBetween(a, b) { return (+b.slice(0, 4) - +a.slice(0, 4)) * 12 + (+b.slice(5, 7) - +a.slice(5, 7)); }
function deprMonth(a, mo) { // straight line, starts the month after purchase
  if (!a.date || !(+a.life > 0)) return 0; if (a.sold && a.sold.slice(0, 7) < mo) return 0;
  const k = monthsBetween(a.date.slice(0, 7), mo); if (k < 1 || k > +a.life) return 0;
  return ((+a.cost || 0) - (+a.residual || 0)) / +a.life;
}
function bookValue(a, mo) { let acc = 0; const k = Math.min(+a.life || 0, Math.max(0, monthsBetween(a.date.slice(0, 7), mo))); acc = k * (((+a.cost || 0) - (+a.residual || 0)) / (+a.life || 1)); return Math.max(+a.residual || 0, (+a.cost || 0) - acc); }

/* ---------- backup & restore ---------- */
async function backupAll() {
  const out = []; let from = 0;
  for (;;) {
    const {data, error} = await SB.from("docs").select("col,id,data").order("col").order("id").range(from, from + 499);
    if (error) return toast("Gagal mengambil data: " + error.message);
    out.push(...data); if (data.length < 500) break; from += 500;
  }
  await S.dl.save({filename: "rouna-os-cadangan-" + today() + ".json", data: JSON.stringify({app: "rouna-os", version: 1, exportedAt: new Date().toISOString(), docs: out})});
  toast("Cadangan diunduh: " + out.length + " dokumen.");
}
async function restoreFile(file) {
  let j; try { j = JSON.parse(await file.text()); } catch (e) { return toast("File bukan JSON yang valid."); }
  const docs = (j.docs || []).filter(d => d && d.col && d.id && d.data && typeof d.data === "object" && d.col !== "staff");
  if (!docs.length) return toast("Tidak ada data yang bisa dipulihkan di file ini.");
  const cols = [...new Set(docs.map(d => d.col))];
  confirmBox("Pulihkan data", docs.length + " dokumen (" + cols.join(", ") + ") akan ditulis. Dokumen dengan ID yang sama akan ditimpa.", "Pulihkan", async () => {
    closeModal(); let done = 0;
    for (let i = 0; i < docs.length; i += 50) {
      const {error} = await SB.from("docs").upsert(docs.slice(i, i + 50).map(d => ({col: d.col, id: String(d.id), data: d.data})));
      if (error) return toast("Berhenti di " + done + " dokumen: " + error.message);
      done += Math.min(50, docs.length - i); toast("Memulihkan… " + done + "/" + docs.length);
    }
    cols.forEach(c => S.db.bump(c)); toast("Selesai: " + done + " dokumen dipulihkan.");
  });
}
document.addEventListener("change", e => { if (e.target.id === "restore-file" && e.target.files[0]) { restoreFile(e.target.files[0]); e.target.value = ""; } });
